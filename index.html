<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>소나기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root { --ink:#2b1d52; --yellow:#ffd23f; --pink:#ff5fa2; --sky:#4f8cff; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:
      repeating-linear-gradient(-30deg, rgba(255,255,255,.06) 0 26px, transparent 26px 56px),
      linear-gradient(180deg, #1f2d6b 0%, #151a45 100%);
    font-family:'Jua', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color:var(--ink);
  }
  #stage {
    width:100%; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:8px;
  }

  /* 위 점수판: 테두리 두른 알약들 */
  #hud { display:flex; align-items:center; gap:6px; padding:0 2px 10px; user-select:none; }
  .pill {
    display:flex; align-items:baseline; gap:5px; white-space:nowrap;
    background:#fff; border:3px solid var(--ink); border-radius:999px; box-shadow:0 4px 0 var(--ink);
    padding:3px 12px; font-variant-numeric:tabular-nums;
  }
  .pill .label { font-size:12px; color:#6b5c95; }
  .pill .value { font-size:21px; }
  .pill.score { background:var(--yellow); flex:1; min-width:0; }
  .pill.score .value { color:#fff; -webkit-text-stroke:5px var(--ink); paint-order:stroke fill; }
  #hud .icons { display:flex; gap:6px; margin-left:auto; }
  #hud button {
    background:#fff; border:3px solid var(--ink); color:var(--ink);
    width:38px; height:38px; border-radius:13px; font-size:16px; cursor:pointer;
    box-shadow:0 4px 0 var(--ink);
  }
  #hud button:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  /* 폰보다 좁은 화면: 알약 이름표를 빼고 숫자만 */
  @media (max-width:330px) {
    .pill { padding:3px 9px; }
    .pill .label { display:none; }
    .pill .value { font-size:19px; }
    #hud button { width:34px; height:34px; font-size:14px; }
    #typing-row button { padding:0 12px; }
  }

  #wrap { position:relative; }
  #game {
    display:block; border-radius:22px; user-select:none;
    box-shadow:0 0 0 4px var(--ink), 0 8px 0 4px var(--ink), 0 20px 40px rgba(0,0,0,.4);
  }

  /* 입력칸 */
  #typing-row { display:flex; gap:8px; padding-top:18px; }
  #typing {
    flex:1; min-width:0;
    font-size:21px; text-align:center; font-family:inherit; color:var(--ink);
    padding:10px 14px; border-radius:18px;
    background:#fff; border:3px solid var(--ink); box-shadow:0 5px 0 var(--ink); outline:none;
  }
  #typing::placeholder { color:#a99fc9; }
  #typing:focus { box-shadow:0 5px 0 var(--ink), 0 0 0 5px rgba(255,210,63,.55); }
  #typing.wrong { animation:shake .25s; background:#ffe0e6; }
  #typing.right { background:#dfffe9; }
  @keyframes shake { 25% { transform:translateX(-7px); } 75% { transform:translateX(7px); } }
  #typing-row button {
    font-size:18px; font-family:inherit; padding:0 18px; border-radius:18px; cursor:pointer;
    background:var(--yellow); color:var(--ink); border:3px solid var(--ink); box-shadow:0 5px 0 var(--ink);
  }
  #typing-row button:active { transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }

  /* 메뉴·결과 화면 */
  #overlay {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:safe center; gap:10px;
    text-align:center; padding:18px 14px;
    background:rgba(28,22,72,.6);
    backdrop-filter:blur(3px);
    border-radius:22px;
    overflow-y:auto;
    touch-action:pan-y;
    user-select:none;
  }
  /* 세로가 짧은 폰(로비 안 + 아래 입력칸 때문에 판이 더 낮다): 시작 버튼이 가려지지 않게 촘촘하게 */
  @media (max-height:720px) {
    #overlay { gap:7px; padding:12px; }
    #overlay h1 { font-size:36px; }
    #overlay p, #overlay h1 + .tag { display:none; }   /* 부제는 제목과 같은 말이라 짧은 화면에선 뺀다 */
    #overlay .label { font-size:12px; }
    #overlay .seg button { font-size:15px; padding:4px 11px; }
    #overlay .main { font-size:20px; padding:8px 32px; margin-top:0; }
    #overlay .legend { font-size:12px; padding:6px 10px; line-height:1.55; }
  }
  #overlay.hidden { display:none; }
  .inked { color:#fff; paint-order:stroke fill; -webkit-text-stroke:6px var(--ink); text-shadow:0 5px 0 var(--ink); }
  #overlay h1 { font-size:clamp(38px, 12vw, 56px); font-weight:400; line-height:1; }
  #overlay h1 .drop { display:inline-block; -webkit-text-stroke:0; text-shadow:none; font-size:.7em; vertical-align:middle; }
  #overlay h2 { font-size:34px; font-weight:400; }
  #overlay p { font-size:15px; color:#fff; line-height:1.55; }
  .tag {
    display:inline-block; background:var(--pink); color:#fff; font-size:15px;
    padding:4px 14px; border-radius:999px; border:3px solid var(--ink); box-shadow:0 3px 0 var(--ink);
  }
  #overlay .group { display:flex; flex-direction:column; align-items:center; gap:6px; }
  #overlay .label { font-size:14px; color:#fff; opacity:.9; }
  #overlay .seg {
    display:flex; background:#fff; border:3px solid var(--ink); border-radius:999px; padding:3px; gap:2px;
    box-shadow:0 4px 0 var(--ink);
  }
  #overlay .seg button {
    background:none; border:none; color:#6b5c95; font-size:17px; font-family:inherit;
    padding:6px 14px; border-radius:999px; cursor:pointer;
  }
  #overlay .seg button.on { background:var(--sky); color:#fff; }
  #overlay .legend {
    background:#fff; border:3px solid var(--ink); border-radius:18px; box-shadow:0 4px 0 var(--ink);
    padding:8px 14px; font-size:14px; line-height:1.7; text-align:left;
  }
  #overlay .legend b { font-weight:400; }
  #overlay .big { font-size:62px; line-height:1; color:var(--yellow); font-variant-numeric:tabular-nums; }
  #overlay .stats {
    display:grid; grid-template-columns:auto auto; gap:4px 18px; font-size:16px;
    background:#fff; border:3px solid var(--ink); border-radius:18px; box-shadow:0 5px 0 var(--ink);
    padding:10px 22px; font-variant-numeric:tabular-nums;
  }
  #overlay .stats dt { color:#6b5c95; text-align:right; }
  #overlay .stats dd { text-align:left; }
  #overlay .main {
    margin-top:4px;
    background:var(--yellow); color:var(--ink); font-size:23px; font-family:inherit;
    border:3px solid var(--ink); border-radius:999px; padding:11px 42px;
    box-shadow:0 6px 0 var(--ink); cursor:pointer;
  }
  #overlay .main:active { transform:translateY(4px); box-shadow:0 2px 0 var(--ink); }
  #overlay .sub { background:none; border:none; color:#fff; font-size:17px; cursor:pointer; padding:6px; font-family:inherit; opacity:.9; }
  #overlay .help { font-size:13px; color:#fff; opacity:.8; }
</style>
</head>
<body>
<div id="stage">
  <div id="col">
    <div id="hud">
      <div class="pill score"><span class="value" id="score">0</span></div>
      <div class="pill"><span class="label">단계</span><span class="value" id="level">1</span></div>
      <div class="pill"><span class="label">타/분</span><span class="value" id="tpm">0</span></div>
      <div class="icons">
        <button id="muteBtn" title="소리">🔊</button>
        <button id="pauseBtn" title="일시정지 (Esc)">⏸</button>
      </div>
    </div>
    <div id="wrap">
      <canvas id="game"></canvas>
      <div id="overlay"></div>
    </div>
    <form id="typing-row" autocomplete="off">
      <input id="typing" type="text" placeholder="단어 입력 후 Enter" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send">
      <button type="submit">입력</button>
    </form>
  </div>
</div>
<script src="words.js"></script>
<script src="game.js"></script>
</body>
</html>
